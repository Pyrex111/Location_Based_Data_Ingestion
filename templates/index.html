<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Drive Portal</title>
  <style>
    #dropzone {
      border: 2px dashed #aaa;
      padding: 20px;
      text-align: center;
      color: #666;
      margin: 50px auto;
      width: 300px;
    }
    #manualCityInput {
      display: none;
      margin: 20px auto;
      text-align: center;
    }
    #fileList {
      margin: 20px auto;
      text-align: center;
    }
    #fileList ul {
      list-style-type: none;
      padding: 0;
    }
    #fileList li {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">Location Based Smart Drive</h1>
  <div id="dropzone">Drag & Drop Files Here</div>



  <!-- Manual City Input -->
  <div id="manualCityInput">
    <label for="manual_city">Could Not Retrieve City Name. Please Enter Manually & Click "Upload File":</label><br><br>
    <input type="text" id="manual_city" placeholder="Enter City Name">
    <button id="uploadButton">Upload File</button>
  </div>

 <!-- Display Uploaded File Names -->
  <div id="fileList">
    <h3>Files to be Uploaded:</h3>
    <ul id="fileNames"></ul>
  </div>


  <script src="{{ url_for('static', filename='upload.js') }}" defer></script>

  <!-- Footer Section -->
  <div class="bottom-text">
    <p class="large-text"><b>Designed By: Taimoor, Suhan, Guangning, Lucy</b></p>
    <p class="large-text"><b>Final Group Project for ECE569A - UVic</b></p>
  </div>
</body>
</html>
